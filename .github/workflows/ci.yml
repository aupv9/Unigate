name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          diff <(gofmt -l .) <(echo -n "")

      - name: go build
        run: go build ./...

      - name: go test
        # internal/store and internal/ruleengine also spin up their own
        # ephemeral redis-server for isolation; the service container
        # above covers any test that just needs a reachable Redis.
        run: go test ./... -v -count=1

  proto-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # Pinned exactly (not @latest): protoc-gen-go stamps its own
      # version into the generated file header, so an unpinned install
      # picking up a newer patch release fails this check on a diff
      # that's just that version string - with no code actually
      # changing. Keep these in sync with `make proto`'s comment below
      # whenever bumping.
      - name: Install protoc-gen-go / protoc-gen-go-grpc
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Regenerate and diff
        run: |
          protoc -I proto \
            --go_out=gen/go --go_opt=paths=source_relative \
            --go-grpc_out=gen/go --go-grpc_opt=paths=source_relative \
            proto/ratelimit/v1/ratelimit.proto
          git diff --exit-code gen/go

  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lua
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Check adapter Lua syntax
        run: |
          find adapters -name '*.lua' -print0 | xargs -0 -n1 luac -p

  apigee-policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xmllint / node
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Validate policy XML
        run: |
          find adapters/apigee -name '*.xml' -print0 | xargs -0 -n1 xmllint --noout
      - name: Validate resource JS syntax
        run: |
          find adapters/apigee -name '*.js' -print0 | xargs -0 -n1 node --check

  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install openapi-spec-validator
        run: pip install openapi-spec-validator
      - name: Validate api/openapi.yaml
        run: openapi-spec-validator api/openapi.yaml

  helm-and-observability-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: helm lint
        run: helm lint deploy/helm/unigate

      - name: helm template (default values)
        run: helm template unigate deploy/helm/unigate > /tmp/rendered-default.yaml

      - name: helm template (secrets + autoscaling off)
        run: |
          helm template unigate deploy/helm/unigate \
            --set redis.passwordSecretName=redis-secret \
            --set auth.existingSecret=unigate-gateway-keys \
            --set autoscaling.enabled=false \
            > /tmp/rendered-secrets.yaml

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install kubeconform
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate rendered manifests against the Kubernetes API schema
        run: |
          kubeconform -strict -summary /tmp/rendered-default.yaml
          kubeconform -strict -summary /tmp/rendered-secrets.yaml

      - name: Install promtool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends prometheus

      - name: Validate Prometheus config + alert rules
        run: |
          promtool check rules deploy/observability/prometheus/alerts.yml
          sed 's#/etc/prometheus/alerts.yml#alerts.yml#' deploy/observability/prometheus/prometheus.yml \
            > deploy/observability/prometheus/prometheus.ci-check.yml
          (cd deploy/observability/prometheus && promtool check config prometheus.ci-check.yml)
          rm deploy/observability/prometheus/prometheus.ci-check.yml

      - name: Validate Grafana dashboard JSON + PromQL syntax
        run: |
          pip install pyyaml
          python3 -c "import json; json.load(open('deploy/observability/grafana/dashboards/unigate.json'))"
          python3 -c "
          import json
          d = json.load(open('deploy/observability/grafana/dashboards/unigate.json'))
          exprs = [t['expr'].replace('\$gateway', '.*').replace('\$rule_id', '.*')
                   for p in d['panels'] for t in p.get('targets', [])]
          open('/tmp/dashboard_exprs.txt', 'w').write('\n'.join(exprs))
          "
          python3 -c "
          import yaml
          exprs = [l.strip() for l in open('/tmp/dashboard_exprs.txt') if l.strip()]
          doc = {'groups': [{'name': 'dashboard-expr-check',
                              'rules': [{'record': f'test_expr_{i}', 'expr': e} for i, e in enumerate(exprs)]}]}
          yaml.safe_dump(doc, open('/tmp/dashboard_exprs_check.yml', 'w'))
          "
          promtool check rules /tmp/dashboard_exprs_check.yml
