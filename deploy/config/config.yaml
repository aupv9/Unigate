# Example configuration for the Universal Rate Limiting Service.
# See docs/PRD.md for the full requirements this maps to.

server:
  grpc_addr: ":9090"
  http_addr: ":8080"
  admin_addr: ":8081"
  metrics_addr: ":9100"
  # mTLS for adapter<->service transport (NFR5), applied uniformly to
  # grpc/http/admin (not metrics - Prometheus scraping is assumed to
  # stay on the internal network). Disabled by default: this fits a
  # deployment where TLS is instead terminated by a service
  # mesh/sidecar in front of these listeners. To enable:
  #   tls:
  #     enabled: true
  #     cert_file: /etc/unigate/tls/server.crt
  #     key_file: /etc/unigate/tls/server.key
  #     require_client_cert: true   # false = server-side TLS only
  #     client_ca_file: /etc/unigate/tls/ca.crt

# OpenTelemetry distributed tracing across the CheckLimit path (gRPC/
# HTTP request -> rule engine -> Redis Lua calls), exported via
# OTLP/HTTP. Disabled by default - requires an OTLP collector
# (OpenTelemetry Collector, Jaeger, Tempo, ...) to actually be running
# at otlp_endpoint.
tracing:
  enabled: false
  otlp_endpoint: "otel-collector:4318"
  service_name: "unigate"
  sample_ratio: 1.0

redis:
  addrs:
    - "redis:6379"
  cluster_mode: false
  dial_timeout: 500ms
  read_timeout: 200ms
  write_timeout: 200ms
  # ${VAR} / ${VAR:-default} are expanded from the process environment
  # at load time (see internal/config/envexpand.go) - never commit a
  # real password here. Empty when unset, matching an unauthenticated
  # local Redis.
  password: "${UNIGATE_REDIS_PASSWORD:-}"

# Per-gateway API keys (NFR5). Set the real values via environment
# variables in every non-local environment - the ":-change-me-*"
# fallback here only exists so local dev works out of the box. See
# .env.example for the full list of variables this config expects.
auth:
  api_keys:
    kong: "${UNIGATE_KONG_API_KEY:-change-me-kong}"
    apisix: "${UNIGATE_APISIX_API_KEY:-change-me-apisix}"
    apigee: "${UNIGATE_APIGEE_API_KEY:-change-me-apigee}"

rules:
  # FR5: brute-force login protection, composite IP+username key,
  # progressive lockout escalating 1min -> 5min -> 30min.
  - id: login-brute-force
    description: "Lock out IP+username combos after repeated failed logins"
    algorithm: sliding_window
    key_parts: ["ip", "username"]
    namespace: default
    fail_mode: fail_closed
    windows:
      - limit: 5
        period: 1m
    lockout:
      enabled: true
      violation_ttl: 1h
      steps:
        - after_violations: 1
          lockout: 1m
        - after_violations: 3
          lockout: 5m
        - after_violations: 6
          lockout: 30m

  # FR3: IP-only limiter for anonymous traffic, FR4: GCRA to smooth bursts.
  - id: anonymous-ip-limit
    description: "Smooth per-IP request rate for unauthenticated traffic"
    algorithm: gcra
    key_parts: ["ip"]
    namespace: default
    fail_mode: fail_open
    burst: 20
    windows:
      - limit: 100
        period: 1m

  # FR2: two windows on the same key (per-minute burst + per-hour quota).
  - id: account-api-quota
    description: "Per-account API quota: short burst window + hourly ceiling"
    algorithm: sliding_window
    key_parts: ["username"]
    namespace: default
    fail_mode: fail_closed
    windows:
      - limit: 60
        period: 1m
      - limit: 1000
        period: 1h
