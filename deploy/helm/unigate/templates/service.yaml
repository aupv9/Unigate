apiVersion: v1
kind: Service
metadata:
  name: {{ include "unigate.fullname" . }}
  labels:
    {{- include "unigate.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "unigate.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ports.http }}
      targetPort: http
    - name: admin
      port: {{ .Values.ports.admin }}
      targetPort: admin
    - name: grpc
      port: {{ .Values.ports.grpc }}
      targetPort: grpc
    - name: metrics
      port: {{ .Values.ports.metrics }}
      targetPort: metrics
